<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orpin — Cold Email Desk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0b0d10;
      --surface: #12151a;
      --surface-2: #1a1e26;
      --border: #2a303c;
      --text: #e8eaed;
      --muted: #8b93a7;
      --accent: #5b8def;
      --green: #3ecf8e;
      --amber: #f0b429;
      --red: #f07178;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "DM Sans", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }
    .wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 2rem 1.25rem 4rem;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 2rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--border);
    }
    header h1 {
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    header p {
      color: var(--muted);
      font-size: 0.9rem;
      margin-top: 0.25rem;
    }
    .badge {
      font-family: "JetBrains Mono", monospace;
      font-size: 0.75rem;
      color: var(--muted);
      background: var(--surface-2);
      border: 1px solid var(--border);
      padding: 0.35rem 0.65rem;
      border-radius: 6px;
    }
    .kpis {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 0.75rem;
      margin-bottom: 2rem;
    }
    .kpi {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.1rem 1.15rem;
    }
    .kpi .label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin-bottom: 0.35rem;
    }
    .kpi .value {
      font-size: 1.65rem;
      font-weight: 600;
      letter-spacing: -0.03em;
      font-variant-numeric: tabular-nums;
    }
    .kpi .sub {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 0.2rem;
    }
    .kpi.green .value { color: var(--green); }
    .kpi.amber .value { color: var(--amber); }
    .section { margin-bottom: 2rem; }
    .section h2 {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--muted);
      margin-bottom: 0.85rem;
    }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    th, td {
      text-align: left;
      padding: 0.7rem 0.85rem;
      border-bottom: 1px solid var(--border);
    }
    th {
      color: var(--muted);
      font-weight: 500;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    tr:hover td { background: var(--surface-2); }
    .tag {
      display: inline-block;
      font-size: 0.72rem;
      padding: 0.15rem 0.45rem;
      border-radius: 4px;
      background: var(--surface-2);
      color: var(--muted);
      border: 1px solid var(--border);
    }
    .tag.rest { color: #7eb8ff; border-color: #2a4a6a; }
    .tag.ecom { color: #9bdbb0; border-color: #2a5a3a; }
    .tag.service { color: #e0c07a; border-color: #5a4a2a; }
    .tag.salon { color: #d4a0e0; border-color: #4a2a5a; }
    .tag.pro { color: #a0c4e0; border-color: #2a3a5a; }
    .empty {
      color: var(--muted);
      padding: 2rem;
      text-align: center;
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: 12px;
    }
    footer {
      margin-top: 3rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--border);
      font-size: 0.8rem;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>Orpin Cold Email Desk</h1>
        <p>Farhan Rahman · High-value local &amp; professional outreach</p>
      </div>
      <div class="badge" id="asOf">Loading…</div>
    </header>

    <div class="kpis" id="kpis"></div>

    <div class="section">
      <h2>Recent sends</h2>
      <div id="recentTable"></div>
    </div>

    <div class="section">
      <h2>By category (this month)</h2>
      <div id="categoryTable"></div>
    </div>

    <footer>
      <span>Orpin · Remote Web Design</span>
      <span><a href="https://farhan-portfolio-orpin.vercel.app/" target="_blank">Portfolio</a></span>
    </footer>
  </div>

  <script>
    const DATA = {
      asOf: "2026-09-08",
      month: {
        sent: 28,
        replies: 2,
        positive: 1,
        followUps: 6,
        deals: 0
      },
      recent: [
        {
          date: "2026-09-08",
          business: "Fresh Fades / Sam The Barber",
          city: "Dayton, OH",
          category: "salon",
          email: "freshfadesbarbershop95@gmail.com",
          note: "No real website — only Square booking page",
          status: "sent"
        },
        {
          date: "2026-09-08",
          business: "STA Plumbing LLC",
          city: "Albuquerque, NM",
          category: "service",
          email: "staplumbing@yahoo.com",
          note: "Repeated headings, incomplete structure",
          status: "sent"
        },
        {
          date: "2026-09-08",
          business: "Plumberdog LLC",
          city: "Wichita, KS",
          category: "service",
          email: "Plumberdog2023@gmail.com",
          note: "Template-feeling copy for veteran-owned shop",
          status: "sent"
        },
        {
          date: "2026-09-07",
          business: "Independent Plumbing Services of Kansas",
          city: "Wichita, KS",
          category: "service",
          email: "Ipsksllc@gmail.com",
          note: "Weak/outdated site",
          status: "sent"
        },
        {
          date: "2026-09-06",
          business: "ARK Specialties",
          city: "La Vista / Omaha, NE",
          category: "service",
          email: "ark.specialties@gmail.com",
          note: "Ad presence, limited web presence",
          status: "sent"
        }
      ],
      byCategory: [
        { name: "Service / Trades", key: "service", sent: 18, replies: 1 },
        { name: "Salon / Barber", key: "salon", sent: 6, replies: 1 },
        { name: "Restaurant / Food", key: "rest", sent: 2, replies: 0 },
        { name: "E-commerce / Retail", key: "ecom", sent: 1, replies: 0 },
        { name: "Professional", key: "pro", sent: 1, replies: 0 }
      ]
    };

    function render() {
      document.getElementById("asOf").textContent = "As of " + DATA.asOf;

      const m = DATA.month;
      const replyRate = m.sent ? ((m.replies / m.sent) * 100).toFixed(1) + "%" : "—";
      document.getElementById("kpis").innerHTML = `
        <div class="kpi"><div class="label">Sent (month)</div><div class="value">${m.sent}</div></div>
        <div class="kpi"><div class="label">Replies</div><div class="value">${m.replies}</div><div class="sub">${replyRate} rate</div></div>
        <div class="kpi green"><div class="label">Positive</div><div class="value">${m.positive}</div></div>
        <div class="kpi amber"><div class="label">Follow-ups</div><div class="value">${m.followUps}</div></div>
        <div class="kpi"><div class="label">Deals</div><div class="value">${m.deals}</div></div>
      `;

      if (!DATA.recent.length) {
        document.getElementById("recentTable").innerHTML = '<div class="empty">No sends logged yet.</div>';
      } else {
        const rows = DATA.recent.map(r => `
          <tr>
            <td>${r.date}</td>
            <td><strong>${r.business}</strong><br><span style="color:var(--muted);font-size:0.8rem">${r.city}</span></td>
            <td><span class="tag ${r.category}">${r.category}</span></td>
            <td style="color:var(--muted);font-size:0.85rem">${r.note}</td>
          </tr>
        `).join("");
        document.getElementById("recentTable").innerHTML = `
          <table>
            <thead><tr><th>Date</th><th>Business</th><th>Category</th><th>Note</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
        `;
      }

      const catRows = DATA.byCategory.map(c => `
        <tr>
          <td><span class="tag ${c.key}">${c.name}</span></td>
          <td>${c.sent}</td>
          <td>${c.replies}</td>
        </tr>
      `).join("");
      document.getElementById("categoryTable").innerHTML = `
        <table>
          <thead><tr><th>Category</th><th>Sent</th><th>Replies</th></tr></thead>
          <tbody>${catRows}</tbody>
        </table>
      `;
    }

    render();
  </script>
</body>
</html>
